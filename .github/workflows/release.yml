name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Portable EXE (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 配置 Electron 下载镜像（加速）
      - name: Configure Electron mirror
        shell: pwsh
        run: |
          "$env:ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "$env:ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      # 跳过 postinstall 里容易出错的 install-app-deps，改为后面显式调用
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 显式 rebuild native deps 到 Electron 的 Node ABI
      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build electron main process (TSC)
        run: npm run build:electron

      # electron-builder --win portable 会自动用 app-builder 打包，
      # 并依赖上一步 install-app-deps 已经把 .node 编译好
      - name: Build portable exe
        run: |
          npx electron-builder --win portable --x64
          Get-ChildItem -Path release -Filter "*.exe" | Select-Object Name, Length

      - name: Generate SHA256 checksum
        run: |
          $exePath = (Get-ChildItem -Path release -Filter "*.exe")[0].FullName
          $exeName = Split-Path $exePath -Leaf
          $hash = (Get-FileHash -Algorithm SHA256 $exePath).Hash.ToLower()
          "$hash  $exeName" | Out-File -FilePath "$exePath.sha256" -Encoding ascii
          Get-Content "$exePath.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenWebUI AI ${{ github.ref_name }}
          body: |
            ## OpenWebUI AI v${{ github.ref_name }}

            内网大模型桌面客户端（免安装 portable exe）

            ### 下载
            - **open-webui-ai-${{ github.ref_name }}-win-x64-portable.exe** — Windows Server 2016 / 10 / 11（双击即用，免安装）
            - **open-webui-ai-${{ github.ref_name }}-win-x64-portable.exe.sha256** — SHA256 校验文件

            ### 使用
            1. 下载 exe 到本地任意目录
            2. 双击运行
            3. 首次启动在「设置」→「AI 模型」里添加内网大模型接口配置
            4. 数据（SQLite 历史、模型配置）自动保存在 exe 同目录 `data/` 下

            ### 功能
            - 多模型配置，Bearer Token AES-256-GCM 加密存储
            - 多会话管理，搜索、置顶、导出 JSON/MD/TXT
            - 支持 IPv4 / IPv6 / HTTP / HTTPS 接口
            - 输入自动规范化（多行→单行），输出自动清洗（??/**/-）
            - 本地附件文本提取（txt/yml/sql/html/xlsx 等）
            - 白天/黑夜主题 + 科幻粒子背景（可关闭）
          files: |
            release/*.exe
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
